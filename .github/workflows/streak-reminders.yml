# Calls the API every hour so people whose local evening has started get
# their streak reminder. The API decides who gets one and never sends twice.
name: Streak reminders

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run streak reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set yet, skipping"; exit 0
          fi
          curl -sS --fail-with-body --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://public-speaking-backend.vercel.app/v1/cron/streak-reminders
